[package]
name = "ec-hook"
version = "0.1.0"
edition = "2021"
description = "Ever-Context (EC) 滚动上下文管理器 - ww3 拦截器插件（Rust 实现）"

[[bin]]
name = "ever-context-hook"
path = "src/main.rs"

[dependencies]
# ww3 协议框架（vendored 进本项目或通过 path 依赖）
# 当前阶段：自实现最小 JSONL RPC 子集，后续可抽取为共享 crate
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
# HTTP 客户端（旁路 OpenAI CLI 调用 / sidecar 通信）
ureq = { version = "3", features = ["json"] }
# 日志
log = "0.4"
env_logger = "0.11"

# 全文索引（内嵌 Tantivy，一个二进制，无 sidecar）
# 与 ec-index 同版本与特性，分词器（ec_cjk_unigram_v1）复用同一实现
tantivy = { version = "=0.22.1", default-features = false, features = ["mmap", "lz4-compression"] }

# 中文语义分词：替换自研 unigram 分词器（ref/jieba-probe 验证：连续短语匹配大幅提升检索精确率，长文本性能快于 unigram）
jieba-rs = "0.11"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"